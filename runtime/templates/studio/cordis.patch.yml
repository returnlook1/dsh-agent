# Agent Studio 受限运行时 —— 静态补丁层
#
# 由 RuntimeMaterializer 复制到 <DSH_HOME>/profiles/studio/ 并替换 {{PLACEHOLDER}}。
# 基础树来自 @deepseek-ai/dsh-sdk-minimal（见同目录 package.json 的 dsh.profile.bundles）。
#
# 依据：
#   docs/RESEARCH-PROFILE.md   profile/patch 组合机制（§3.6 对本文件的评审）
#   docs/RESEARCH-SDK.md §5    审批通道不存在 → 审批走控制通道文件
#   docs/DECISIONS.md §3       L1 能力层必须移除高危插件
#
# 重要事实（已实测）：
#   1. 补丁行顺序没有加载语义（dsh-base 注释原文 "Row order carries no load semantics;
#      activation is service-availability driven"）。因此"policy 插件先加载"不能靠 insert
#      顺序保证，必须由 policy 插件内部的 ctx.tools.guard() + tools/pre-execute 保证覆盖；
#      这些钩子对所有后续注册的工具都生效，与注册先后无关。
#   2. `insert` 只负责新增；禁用已有条目用 `disabled: true`（没有 remove 语义）。
#   3. 同一 id 的 `config` 是**整段替换**，不是深合并——覆盖时必须写全要保留的字段。
#   4. 这里只做"能力层"收敛（L1）。真正的工具白名单在 agent-policy 插件里（L2），
#      两层都要有：L1 移除高危能力，L2 对未授权工具默认拒绝。

# ---------------------------------------------------------------------------
# 1) 移除高危能力
# ---------------------------------------------------------------------------
# Shell / 终端 / 持久化命令行 —— 受限 Agent 不允许任意命令执行
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true

# 文件系统工具（读/写/改/读图）—— 业务数据只允许通过已授权业务工具获取
# 注：底层 `filesystem`（dsh-fs-local）服务本身不是沙箱边界，它的 cwd 也"不构成限制"；
# 真正的约束来自"没有任何文件工具被注册"。因此这里移除的是模型可见的全部文件工具。
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true

# 会话日志上传（官方 API 的 session-log 扩展）—— 受限环境不上报会话内容
- id: session-log-deepseek
  disabled: true

# ---------------------------------------------------------------------------
# 2) 固定工具呈现方式为 native（方案 §五：第一版不开放 PTC）
# ---------------------------------------------------------------------------
- id: tools
  config:
    mode: native

# ---------------------------------------------------------------------------
# 3) 系统提示词
#    显式覆盖，不依赖 sdk-minimal 的默认值（默认是 "You are a helpful software
#    engineer assistant."）。personaPrefix 用子进程环境变量传入：网关为每个运行时
#    写入 Agent 配置里的 prompt.system，因此提示词不在磁盘上重复保存。
#    注意 config 为整段替换，所以要保留 includeHarnessIdentity / includeRuntimeContext。
# ---------------------------------------------------------------------------
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a restricted business assistant that may only use explicitly authorized tools.'

# ---------------------------------------------------------------------------
# 4) 沙箱默认模式
#    sdk-minimal 的 bundle 把 sandbox-policy.mode 写死成 danger-full-access。
#    对受限 Agent 改成 read-only（该插件自身的 fail-safe 默认值）。
#    说明：当前树里没有 fs/bash 沙箱消费者，workspaceRoot 只是为将来接入沙箱预留；
#    现阶段的真实约束是"没有文件与命令工具"。部署时仍应把运行时目录权限收紧。
# ---------------------------------------------------------------------------
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: '{{WORKSPACE}}'

# ---------------------------------------------------------------------------
# 5) Agent Studio 自有插件
#    policy 内部安装 guard + pre-execute 监听器；guard 是单调的（monotonic），
#    任何后续注册的工具都无法绕过它，因此不需要依赖加载顺序。
# ---------------------------------------------------------------------------
- insert:
    - id: agent-studio-policy
      name: '{{POLICY_PLUGIN}}'
    - id: agent-studio-tools
      name: '{{TOOLS_PLUGIN}}'
    - id: agent-studio-audit
      name: '{{AUDIT_PLUGIN}}'
