<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Agent Playground — 配置 Skills / MCP / 模型并测试 DSH 对话" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h7' stroke='%2393c5fd' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Agent Playground</title>
    <style>
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100vh;
        color: rgba(0, 0, 0, 0.62);
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      .boot__mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(140deg, #1d4ed8, #0b1220);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .boot__text {
        margin: 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__mark">AP</div>
        <p class="boot__text">正在加载 Agent Playground…</p>
      </div>
    </div>
    <noscript>Agent Playground 需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
